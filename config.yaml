# Latest News — automation settings
# Edit this file to change what the bot watches and how the site looks.

site:
  title: "Latest News"
  tagline: "Every development, written fresh from many sources"
  # Public URL of the site (used in RSS + sitemap). For GitHub Pages:
  #   https://<user>.github.io/<repo>
  base_url: "https://dnstudio-latest.github.io/Latest-news"
  language: "en"
  articles_on_home: 30

pipeline:
  # Only consider items published within this many hours.
  max_age_hours: 36
  # A "development" needs at least this many independent sources before
  # the bot writes about it (1 = write about everything).
  min_sources: 2
  # Hard cap on new articles per run (controls API cost).
  max_new_articles_per_run: 8
  # 0..1 — how similar two headlines must be to count as the same story.
  similarity_threshold: 0.32

writer:
  # Model used to write articles. Needs ANTHROPIC_API_KEY.
  # Without a key the bot falls back to a simple extractive summary.
  model: "claude-opus-5-5"
  effort: "medium"

# ---------------------------------------------------------------------------
# Sources. Remove or add freely. All of these work without API keys.
# ---------------------------------------------------------------------------
sources:
  rss:
    - { name: "BBC World", url: "https://feeds.bbci.co.uk/news/world/rss.xml", category: "World" }
    - { name: "BBC Technology", url: "https://feeds.bbci.co.uk/news/technology/rss.xml", category: "Technology" }
    - { name: "BBC Business", url: "https://feeds.bbci.co.uk/news/business/rss.xml", category: "Business" }
    - { name: "Al Jazeera", url: "https://www.aljazeera.com/xml/rss/all.xml", category: "World" }
    - { name: "The Guardian World", url: "https://www.theguardian.com/world/rss", category: "World" }
    - { name: "NPR News", url: "https://feeds.npr.org/1001/rss.xml", category: "World" }
    - { name: "The Verge", url: "https://www.theverge.com/rss/index.xml", category: "Technology" }
    - { name: "TechCrunch", url: "https://techcrunch.com/feed/", category: "Technology" }
    - { name: "Ars Technica", url: "https://feeds.arstechnica.com/arstechnica/index", category: "Technology" }
    - { name: "ESPN", url: "https://www.espn.com/espn/rss/news", category: "Sports" }
    - { name: "Times of India", url: "https://timesofindia.indiatimes.com/rssfeedstopstories.cms", category: "India" }
    - { name: "NDTV", url: "https://feeds.feedburner.com/ndtvnews-top-stories", category: "India" }
    - { name: "The Hindu", url: "https://www.thehindu.com/news/national/feeder/default.rss", category: "India" }

  # Google News search feeds — one per topic you care about.
  google_news:
    language: "en-IN"
    country: "IN"
    queries:
      - { q: "breaking news", category: "World" }
      - { q: "India", category: "India" }
      - { q: "technology", category: "Technology" }
      - { q: "stock market", category: "Business" }
      - { q: "cricket", category: "Sports" }

  # Social media
  reddit:
    subreddits: ["worldnews", "news", "technology", "india", "sports"]
    min_score: 200
  hackernews:
    min_points: 150
  mastodon:
    instance: "https://mastodon.social"
    hashtags: ["news", "breakingnews", "technology"]
  bluesky:
    queries: ["breaking news"]
